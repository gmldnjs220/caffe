<!doctype html>
<html class="no-js" lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>로그인 · ONE BOTTLE</title>
  <meta name="description" content="원보틀 계정으로 로그인하거나 회원가입하기">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">

  <link rel="icon" href="favicon.ico?v=3" sizes="any">
  <link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png?v=3">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#14110e">
  <!-- 메인 화면 안(iframe)에서 열렸는지 확인해서 위쪽 메뉴를 숨김 -->
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('is-embed');
      window.addEventListener('load', function () {
        var path = location.pathname.split('/').pop() + location.hash;
        window.parent.postMessage({ type: 'onebottle-page', path: path }, '*');
      });
    }
  </script>
</head>

<body class="page-sub">

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ONE BOTTLE 홈">
      <span class="brand__name">ONE BOTTLE</span>
      <span class="brand__sub">Coffee / Beer</span>
    </a>

    <nav class="gnb" aria-label="주 메뉴">
      <ul>
        <li><a href="about.html">소개</a></li>
        <li><a href="menu.html">메뉴</a></li>
        <li><a href="notice.html">공지사항</a></li>
        <li><a href="location.html">오시는 길</a></li>
        <li><a href="login.html" aria-current="page">로그인</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-page content-page--login">
    <div class="auth" aria-busy="true">

      <div class="page-head">
        <p class="page-head__eyebrow">Account</p>
        <h1 class="page-head__title js-title">로그인</h1>
      </div>

      <!-- Firebase 설정이 없을 때 안내 (js/firebase-config.js) -->
      <p class="auth-alert js-setup" hidden>
        로그인 설정이 아직 연결되지 않았어요.<br>
        <code>js/firebase-config.js</code>에 Firebase 웹 앱 설정값을 넣어 주세요.
      </p>

      <!-- 로그인 전 -->
      <section class="auth-card js-signed-out" hidden>
        <div class="auth-tabs" role="tablist" aria-label="로그인 또는 회원가입">
          <button type="button" class="auth-tabs__btn js-tab" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true" data-tab="login">로그인</button>
          <button type="button" class="auth-tabs__btn js-tab" role="tab" id="tab-signup" aria-controls="panel-signup" aria-selected="false" data-tab="signup" tabindex="-1">회원가입</button>
        </div>

        <form class="auth-form js-login-form" id="panel-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="field">
            <label class="field__label" for="login-email">이메일</label>
            <input class="field__input" id="login-email" name="email" type="email" autocomplete="email" inputmode="email" required>
          </div>
          <div class="field">
            <div class="field__row">
              <label class="field__label" for="login-password">비밀번호</label>
              <button type="button" class="auth-link js-reset">비밀번호를 잊으셨나요?</button>
            </div>
            <input class="field__input" id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="auth-btn auth-btn--primary">로그인</button>
        </form>

        <form class="auth-form js-signup-form" id="panel-signup" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
          <div class="field">
            <label class="field__label" for="signup-name">이름</label>
            <input class="field__input" id="signup-name" name="name" type="text" autocomplete="name" maxlength="30" required>
          </div>
          <div class="field">
            <label class="field__label" for="signup-email">이메일</label>
            <input class="field__input" id="signup-email" name="email" type="email" autocomplete="email" inputmode="email" required>
          </div>
          <div class="field">
            <label class="field__label" for="signup-password">비밀번호</label>
            <input class="field__input" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" aria-describedby="signup-password-hint" required>
            <p class="field__hint" id="signup-password-hint">6자 이상</p>
          </div>
          <div class="field">
            <label class="field__label" for="signup-password2">비밀번호 확인</label>
            <input class="field__input" id="signup-password2" name="password2" type="password" autocomplete="new-password" required>
          </div>
          <button type="submit" class="auth-btn auth-btn--primary">회원가입</button>
        </form>

        <p class="auth-divider"><span>또는</span></p>

        <button type="button" class="auth-btn auth-btn--google js-google">
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          구글 계정으로 계속하기
        </button>
      </section>

      <!-- 로그인 후 -->
      <section class="auth-card auth-me js-signed-in" hidden>
        <div class="auth-me__avatar js-me-avatar" aria-hidden="true"></div>
        <p class="auth-me__name js-me-name"></p>
        <p class="auth-me__email js-me-email"></p>
        <div class="auth-me__actions">
          <a class="auth-btn auth-btn--primary" href="menu.html">메뉴 보러 가기</a>
          <button type="button" class="auth-btn js-logout">로그아웃</button>
        </div>
      </section>

      <p class="auth-msg js-msg" role="status" aria-live="polite" hidden></p>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>

</body>

</html>
