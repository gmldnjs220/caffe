<!doctype html>
<html class="no-js" lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ONE BOTTLE · Coffee / Beer</title>
  <meta name="description" content="안양 석수동 카페 원보틀 — 커피, 맥주, 디저트 & 스낵">

  <!-- 공유 미리보기(카카오톡, SNS). 도메인이 정해지면 og:url을 추가하고 og:image를 https:// 절대 주소로 바꿔 주세요 -->
  <meta property="og:site_name" content="ONE BOTTLE">
  <meta property="og:title" content="ONE BOTTLE · Coffee / Beer">
  <meta property="og:description" content="안양 석수동 카페 원보틀 — 커피, 맥주, 디저트 & 스낵">
  <meta property="og:type" content="website">
  <meta property="og:image" content="img/og-image.jpg">
  <meta property="og:image:alt" content="통창 너머로 벚꽃이 보이는 원보틀 카페 내부">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/home.css">

  <link rel="icon" href="favicon.ico?v=3" sizes="any">
  <link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png?v=3">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#14110e">
</head>

<body class="page-home">

  <!-- 왼쪽 반투명 사이드바 -->
  <header class="sidebar js-sidebar">
    <a class="sidebar__logo" href="index.html">
      <img src="img/logo-white.png" alt="ONE BOTTLE Coffee / Beer" width="520" height="550">
    </a>

    <!-- 모바일에서만 보이는 메뉴 열기 버튼 -->
    <button type="button" class="sidebar__toggle js-sidebar-toggle" aria-expanded="false" aria-controls="sidebar-panel">
      <span class="sidebar__toggle-bar" aria-hidden="true"></span>
      <span class="visually-hidden">메뉴 열기</span>
    </button>

    <div class="sidebar__panel" id="sidebar-panel">
      <nav class="sidebar__nav" aria-label="주 메뉴">
        <ul>
          <li class="sidebar__auth">
            <a href="login.html" data-tab="login" data-auth-link data-label-in="MY ACCOUNT">LOGIN</a>
            <a href="login.html" data-tab="signup">SIGN IN</a>
          </li>
          <li><a href="about.html">ABOUT</a></li>
          <li><a href="notice.html">NOTICE</a></li>
          <li><a href="location.html">LOCATION</a></li>
          <li class="sidebar__accent"><a href="menu.html">MENU</a></li>
        </ul>
      </nav>

      <a class="sidebar__icon" href="https://naver.me/Fw7P3RqZ" aria-label="네이버 지도에서 원보틀 보기">
        <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M12 21s-6.5-6.1-6.5-11A6.5 6.5 0 0 1 18.5 10c0 4.9-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </a>
      <address class="sidebar__info">
        경기도 안양시 만안구<br>석수동 850-5 1층
      </address>

      <ul class="sidebar__util">
        <li><b><a href="tel:031-471-3271">call / 031-471-3271</a></b></li>
        <li><b>영업시간 / 11:30 - 18:00</b></li>
      </ul>

    </div>
  </header>

  <!-- 사이드바 블러 배경: 호버하면 사이드바만큼, 메뉴를 누르면 화면 끝까지 펼쳐짐 -->
  <div class="sidebar-bg" aria-hidden="true"></div>

  <!-- 메뉴를 누르면 해당 페이지(about.html 등)가 이 안에 페이드 인으로 열림 -->
  <section class="page-layer js-page-layer" aria-label="페이지 내용">
    <button type="button" class="page-layer__close js-page-close" aria-label="닫고 메인으로">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <iframe class="page-layer__frame js-page-frame" title="페이지 내용" src="about:blank"></iframe>
  </section>

  <main class="hero" aria-roledescription="carousel" aria-label="원보틀 공간 사진">
    <div class="hero__slides">
      <figure class="slide is-active">
        <img src="img/main/hero-03.webp" alt="통창과 원목 테이블이 있는 홀" style="object-position: 50% 50%;" fetchpriority="high">
      </figure>
      <figure class="slide">
        <img src="data:," data-src="img/main/hero-01.webp" alt="통창 너머로 벚꽃이 보이는 카페 내부" style="object-position: 50% 45%;">
      </figure>
      <figure class="slide">
        <img src="data:," data-src="img/main/hero-04.webp" alt="빔프로젝터 영상이 비치는 벽 앞의 팔레트 테이블" style="object-position: 50% 55%;">
      </figure>
      <figure class="slide">
        <img src="data:," data-src="img/main/hero-05.webp" alt="전구 조명이 켜진 밤의 잔디 테라스" style="object-position: 50% 60%;">
      </figure>
      <figure class="slide">
        <img src="data:," data-src="img/main/hero-06.webp" alt="벚꽃이 핀 나무와 테라스 난간" style="object-position: 50% 45%;">
      </figure>
      <figure class="slide">
        <img src="data:," data-src="img/main/hero-07.webp" alt="벚꽃이 늘어선 카페 옆 산책로">
      </figure>
      <figure class="slide">
        <img src="data:," data-src="img/main/hero-08.webp" alt="벚꽃이 내려다보이는 테라스 좌석">
      </figure>
      <figure class="slide">
        <img src="data:," data-src="img/main/hero-10.webp" alt="초록 나무가 보이는 테라스의 흰 의자" style="object-position: 50% 55%;">
      </figure>
      <figure class="slide">
        <img src="data:," data-src="img/main/hero-11.webp" alt="테라스 지붕 너머로 보이는 저녁 하늘" style="object-position: 50% 60%;">
      </figure>
    </div>

    <div class="hero__shade" aria-hidden="true"></div>

    <!-- 가운데 상호명 (ONE BOTTLE이 화면 정중앙) -->
    <div class="hero__copy">
      <h1 class="hero__title">ONE BOTTLE</h1>
      <p class="hero__desc">한 병의 여유, 원보틀</p>
    </div>

    <!-- 오른쪽 세로 점 (스크롤하면 넘어감) -->
    <div class="hero__controls">
      <div class="hero__dots" role="tablist" aria-label="슬라이드 선택" aria-orientation="vertical"></div>
      <p class="visually-hidden"><span class="js-current">01</span> / <span class="js-total">11</span></p>
    </div>
  </main>

  <script src="js/app.js"></script>

  <script type="module" src="js/auth-nav.js"></script>

</body>

</html>
