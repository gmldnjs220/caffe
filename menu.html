<!doctype html>
<html class="no-js" lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>메뉴 · ONE BOTTLE</title>
  <meta name="description" content="원보틀의 커피, 라떼, 티, 에이드, 스무디, 프라페와 베이커리, 케이크 메뉴">

  <!-- 공유 미리보기(카카오톡, SNS). 도메인이 정해지면 og:url을 추가하고 og:image를 https:// 절대 주소로 바꿔 주세요 -->
  <meta property="og:site_name" content="ONE BOTTLE">
  <meta property="og:title" content="메뉴 · ONE BOTTLE">
  <meta property="og:description" content="원보틀의 커피, 라떼, 티, 에이드, 스무디, 프라페와 베이커리, 케이크 메뉴">
  <meta property="og:type" content="website">
  <meta property="og:image" content="img/og-image.jpg">
  <meta property="og:image:alt" content="통창 너머로 벚꽃이 보이는 원보틀 카페 내부">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <!-- Supabase 서버와 라이브러리 CDN에 미리 연결해 두기 (주소는 js/supabase-config.js 의 url 과 같아야 함) -->
  <link rel="preconnect" href="https://zcyeeqluvbudfppmlqvc.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/menu.css">

  <link rel="icon" href="favicon.ico?v=3" sizes="any">
  <link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png?v=3">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#14110e">
  <!-- 메인 화면 안(iframe)에서 열렸는지 확인해서 위쪽 메뉴를 숨김 -->
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('is-embed');
      window.addEventListener('load', function () {
        var path = location.pathname.split('/').pop() + location.hash;
        window.parent.postMessage({ type: 'onebottle-page', path: path }, '*');
      });
    }
  </script>
</head>

<body class="page-sub">

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ONE BOTTLE 홈">
      <span class="brand__name">ONE BOTTLE</span>
      <span class="brand__sub">Coffee / Beer</span>
    </a>

    <nav class="gnb" aria-label="주 메뉴">
      <ul>
        <li><a href="about.html">소개</a></li>
        <li><a href="menu.html" aria-current="page">메뉴</a></li>
        <li><a href="order.html">주문</a></li>
        <li><a href="notice.html">공지사항</a></li>
        <li><a href="review.html">리뷰</a></li>
        <li><a href="location.html">오시는 길</a></li>
        <li><a href="login.html" data-auth-link data-label-in="내 계정">로그인</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-page content-page--menu">
    <div class="page-head">
      <p class="page-head__eyebrow">Menu</p>
      <h1 class="page-head__title">메뉴</h1>
      <p class="page-head__desc">메뉴를 누르면 자세한 정보를 볼 수 있어요 · 가격 단위 1,000원</p>
    </div>

    <div class="filter" role="toolbar" aria-label="카테고리 선택">
      <div class="filter__scroll js-filter"></div>
    </div>

    <div class="menu-board js-board" aria-live="polite"></div>
  </main>

  <dialog class="sheet js-sheet" aria-labelledby="sheet-title">
    <div class="sheet__inner">
      <button type="button" class="sheet__close js-sheet-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <p class="sheet__cat js-sheet-cat"></p>
      <h2 class="sheet__title" id="sheet-title"></h2>
      <div class="sheet__price js-sheet-price"></div>
      <ul class="sheet__tags js-sheet-tags"></ul>
      <p class="sheet__desc js-sheet-desc"></p>
      <div class="sheet__options js-sheet-options"></div>
    </div>
  </dialog>

  <!-- 메뉴를 먼저 그리고(지난번 메뉴 또는 menu-data.js), 그 뒤에 Supabase 라이브러리를 받아 최신 메뉴로 바꿈 -->
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/menu-data.js"></script>
  <script defer src="js/menu-api.js"></script>
  <script defer src="js/menu.js"></script>
  <script defer src="js/filter-arrows.js"></script>
  <!-- Supabase: 라이브러리 → 클라이언트(window.sb) 순서. 메뉴 그리기를 막지 않도록 메뉴 스크립트 뒤에 둠 -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script defer src="js/supabase-client.js"></script>

  <script type="module" src="js/auth-nav.js"></script>
</body>

</html>
